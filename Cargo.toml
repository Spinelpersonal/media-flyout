[package]
name = "media-flyout"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight, event-driven Windows media flyout"
license = "GPL-3.0-only"
repository = "https://github.com/Spinelpersonal/media-flyout"

[dependencies]
windows = { version = "0.62.2", features = [
    "Foundation", "Foundation_Collections", "Media_Control",
    "Graphics_Imaging", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT",
    "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls",
    "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security",
    "Win32_System_Registry", "Win32_Storage_FileSystem",
] }
windows-future = "0.3.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }
toml_edit = "0.25.19"

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
