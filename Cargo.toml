[package]
name = "media-flyout"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight, event-driven Windows media flyout"
license = "GPL-3.0-only"
repository = "https://github.com/Spinelpersonal/media-flyout"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "functions", "fallible_uint"] }
tempfile = "3"
microfft = { version = "0.6", default-features = false, features = ["size-2048"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "0.10"
ureq = "3"
url = "2"
windows = { version = "0.62.2", features = [
    "Foundation", "Foundation_Collections", "Media_Control",
    "Graphics_Imaging", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT",
    "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls",
    "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security",
    "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_UI_Controls_Dialogs", "Win32_System_WindowsProgramming",
    "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx", "Win32_Storage_EnhancedStorage", "Win32_System_Diagnostics_ToolHelp",
] }
windows-future = "0.3.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }
toml_edit = "0.25.19"

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio_Endpoints"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
