# Save, then choose "Reload settings" from the tray menu.
shortcut = "Ctrl+Space"

# top-center, top-left, top-right, bottom-center, bottom-left, bottom-right
position = "top-center"
# active (foreground application's screen), cursor, or primary
monitor = "active"
margin = 20 # logical pixels inside the monitor's work area

# Exact GSMTC source application ID, e.g. "Spotify.exe". Empty means automatic.
preferred_app = ""
# When enabled, choosing a session also saves its application for future launches.
remember_preferred_app = false

# dark, light, or system
theme = "dark"
# Media controls: default (neutral grey), artwork (dominant cover colour), or custom.
control_color_mode = "artwork"
# Used in custom mode. Enter six hexadecimal digits (#RRGGBB).
custom_control_color = "#99A0A5"
animations = true
show_progress = true
# Show a spectrum of the default Windows audio output while the flyout is visible.
show_visualizer = false
# Keep a local listening history for the tray's Listening history panel.
listening_history = false

# Track-change notifications use the configured monitor and edge margin.
notifications_enabled = false
notification_seconds = 4 # 1–60
notification_position = "bottom-right" # same choices as position
notification_hide_fullscreen = true

# Set to 0 to keep the flyout open until explicitly dismissed.
dismiss_after_seconds = 10
dismiss_on_outside_click = true

# Opt in here, or use "Start with Windows" in the tray menu.
autostart = false
